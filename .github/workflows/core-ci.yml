name: Core + Player View + Web + C-03.5 Advanced Reasoning CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test core, projection, web, cognition, five-layer reasoning, world hypotheses, and strategy contracts
        run: npm test
      - name: Build server domain package
        run: npm run build:core
      - name: Build Next.js Web Alpha
        run: npm run build
